name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended

      - name: Compile LaTeX
        run: |
          latexmk -pdf -interaction=nonstopmode -file-line-error Resume_Shengran_Jin.tex
          latexmk -pdf -interaction=nonstopmode -file-line-error Resume_Shengran_Jin_Google.tex

      - name: Assemble site
        run: |
          mkdir -p _site
          cp Resume_Shengran_Jin.pdf _site/resume.pdf
          cp Resume_Shengran_Jin_Google.pdf _site/resume-google.pdf
          echo "resume.kevinjin.dev" > _site/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
